[package]
name = "borderless-shatter"
version = "0.2.3"
edition = "2024"
license = "MIT"
rust-version = "1.100"

[dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_Security", "Win32_Security_Authorization", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_System_Pipes", "Win32_System_Console", "Win32_Globalization"] }
tray-icon = "0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1.54", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
sha2 = "0.11"
schemars = "1"
rmcp = { version = "3.11.0", default-features = false, features = ["server", "macros", "transport-io"] }
# GUI: gpui-kit 0.11.0 pins gpui-pre 0.3.14 + gpui_platform and re-exports gpui, gpui-component and icons.
gpui-kit = { version = "=0.11.0", default-features = false, features = ["component", "assets"] }

[dev-dependencies]
proptest = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
