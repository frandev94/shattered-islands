<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="t d">
<title id="t">Shattered Islands — borderless windows and screen islands for Windows</title>
<desc id="d">A 32:9 monitor whose screen glass is split by one forking crack into three islands. A frameless window sits inside the left island, a 16:9 half; the two dimmer right islands each hold a ghost window. Next to it, the wordmark Shattered Islands.</desc>
<style>
.f{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.m1,.m2,.m3,.o{stroke-dasharray:1;stroke-dashoffset:0}
.m1{animation:draw .45s ease-in}
.m2{animation:draw .8s ease-out .45s}
.m3{animation:draw .4s ease-out .45s}
.o{animation:draw .25s ease-out 1.1s}
.k{animation:in .25s ease-out 1.2s}
.i1{animation:in .5s ease-out 1.3s}
.w1{animation:in .5s ease-out 1.5s}
.i2{animation:in .5s ease-out 1.55s}
.i3{animation:in .5s ease-out 1.75s}
.g2{animation:in .4s ease-out 1.8s}
.g3{animation:in .4s ease-out 2s}
.m1,.m2,.m3,.o,.k,.i1,.w1,.i2,.i3,.g2,.g3{animation-fill-mode:backwards}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes in{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.m1,.m2,.m3,.o,.k,.i1,.w1,.i2,.i3,.g2,.g3{animation:none}}
</style>
