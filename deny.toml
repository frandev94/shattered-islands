# cargo-deny policy. Project rule: NO GPL code (Borderless Gaming GPL-2.0, ihateborders GPL-3.0, Zed GPL crates).
# Anything not in `allow` fails `cargo deny check licenses`, so GPL/LGPL/AGPL always fail.
[graph]
targets = ["x86_64-pc-windows-msvc"]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
]
# Per-crate exceptions; each names the dependency chain that needs it.
exceptions = [
    # 0BSD is permissive: gpui-kit -> gpui-component -> enum-iterator -> enum-iterator-derive.
    { allow = ["0BSD"], crate = "enum-iterator" },
    { allow = ["0BSD"], crate = "enum-iterator-derive" },
    # MPL-2.0 (file-level copyleft, unmodified use): gpui-kit-assets -> rust-embed -> shellexpand -> dirs -> dirs-sys -> option-ext.
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
