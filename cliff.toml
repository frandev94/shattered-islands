# git-cliff: the default config (`git cliff --init`, 2.14.2) except the [bump] block and one skip rule.
# On 0.x a breaking change bumps the minor and anything else the patch (CONTRIBUTING.md#releases).
# Rather than regenerating the whole file with `-o`, the release workflow runs
# `git cliff --unreleased --tag vX.Y.Z --prepend CHANGELOG.md`: only the new section goes under `header`,
# above the existing sections, so the hand-written `## [0.1.0]` entry (it predates conventional commits) survives.
# `header` must match the top of CHANGELOG.md byte for byte, or --prepend duplicates it: change both in the
# same commit (test.yml fails when they differ). Never add a hand-written section above the generated ones.
# The release commit stays out of every section anyway (skip rule below).
# A partial [git] replaces the default commit_parsers groups, so the whole block is kept.
[bump]
features_always_bump_minor = false
breaking_always_bump_major = false

[changelog]
header = """# Changelog

Format based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
    ### {{ entry.group | striptags | trim | upper_first }}
    {% for commit in entry.commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""
trim = true
render_always = true
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
commit_preprocessors = []
protect_breaking_commits = false
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->🚀 Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^doc", group = "<!-- 3 -->📚 Documentation" },
    { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
    { message = "^refactor", group = "<!-- 2 -->🚜 Refactor" },
    { message = "^style", group = "<!-- 5 -->🎨 Styling" },
    { message = "^test", group = "<!-- 6 -->🧪 Testing" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps.*\\)", skip = true },
    { message = "^chore\\(pr\\)", skip = true },
    { message = "^chore\\(pull\\)", skip = true },
    { message = "^chore|^ci", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
    { body = ".*security", group = "<!-- 8 -->🛡️ Security" },
    { message = "^revert", group = "<!-- 9 -->◀️ Revert" },
    { message = ".*", group = "<!-- 10 -->💼 Other" },
]
filter_commits = false
fail_on_unmatched_commit = false
link_parsers = []
use_branch_tags = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
recurse_submodules = false
