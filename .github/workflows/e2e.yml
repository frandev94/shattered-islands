name: e2e

# The ignored suites (e2e, mcp + cli, ipc::pipe) on a hosted Windows desktop, after a session probe
# that checks the runner can show, restyle and move a foreign window. Kept out of test.yml because
# release.yml calls test.yml on every release. workflow_dispatch only works once this file is on
# main; the path-filtered pull_request trigger runs it on the PRs that can change the result.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/**
      - tests/**
      - examples/**
      - locales/**
      - .cargo/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/e2e.yml

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the channel and components; rustup installs them on first use.
      - run: rustup show active-toolchain
      # Caches saved on a PR branch are visible only to that branch; ones saved on the default branch are
      # visible to every branch. This workflow does not run on main, so a main-only save would stay cold.
      # rust-cache already saves only when the exact key (Cargo.lock, toolchain) missed, so each PR branch
      # pays the ~2 min save once and its later pushes restore for free. cache-on-failure saves that first
      # run even when a suite fails, so the fix push is not cold again. A new branch starts from main's
      # cache if one exists: run `gh workflow run e2e.yml --ref main` after Cargo.lock changes to warm it.
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          cache-on-failure: true
      # Also builds the examples the suites and the probe launch (testwin, session_probe).
      - run: cargo build --all-targets
      - run: cargo test --example session_probe
      # One step so every command runs and reports even after a failure; the summary is written in
      # `finally` and the step fails at the end if anything did.
      - name: Probe the session, then run the suites twice
        timeout-minutes: 75
        shell: python
        run: |
          import csv, hashlib, io, json, os, pathlib, re, subprocess, sys, traceback

          LOGS = pathlib.Path(os.environ["RUNNER_TEMP"], "e2e-logs")
          APPDATA = pathlib.Path(os.environ["APPDATA"], "BorderlessShatter")
          E2E_TMP = pathlib.Path("target", "e2e-tmp")
          PROBE = pathlib.Path("target", "debug", "examples", "session_probe.exe")
          PROBE_KEYS = ["window", "visible", "show_event", "style_roundtrip", "rect_roundtrip",
                        "set_foreground", "is_foreground", "foreground_event", "usable", "error"]
          SUITES = [
              ("e2e", ["cargo", "e2e"]),
              ("mcp-cli", ["cargo", "test", "--test", "mcp", "--test", "cli", "--", "--ignored", "--test-threads=1"]),
              ("pipe", ["cargo", "test", "--lib", "ipc::pipe", "--", "--ignored", "--test-threads=1"]),
          ]
          RELEASE_ENV = {"CARGO_PROFILE_RELEASE_LTO": "false", "CARGO_PROFILE_RELEASE_CODEGEN_UNITS": "16"}
          RESULT = re.compile(r"test result: (?:ok|FAILED)\. (\d+) passed; (\d+) failed")
          ANSI = re.compile(r"\x1b\[[0-9;]*m")

          failures = []
          suites = []  # (suite, run, passed, failed, exit, ok)
          hygiene = []  # (after, testwin.exe, resident PIDs, e2e-tmp, APPDATA, status)
          probe = None
          probe_exit = None
          resident_before = testwin_before = appdata_before = None
          log_no = 0

          def pids(image):
              out = subprocess.run(["tasklist", "/FO", "CSV", "/NH", "/FI", f"IMAGENAME eq {image}"],
                                   capture_output=True, text=True, check=True).stdout
              return sorted(int(r[1]) for r in csv.reader(io.StringIO(out)) if len(r) > 1 and r[0].lower() == image)

          def appdata_state():
              """None when the directory is absent, else the sha256 of every file in it."""
              if not APPDATA.exists():
                  return None
              return {str(p.relative_to(APPDATA)): hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in sorted(APPDATA.rglob("*")) if p.is_file()}

          def log_path(name, run):
              global log_no
              log_no += 1
              LOGS.mkdir(parents=True, exist_ok=True)
              return LOGS / f"{log_no:02d}-{name}-run{run}.log"

          def suite(name, run, cmd, env=None, tests=True):
              """Streams cmd to the console and its log; green on exit 0 and, for tests, 0 failed and >= 1 passed."""
              print(f"::group::{name} run {run}: {' '.join(cmd)}", flush=True)
              passed = failed = 0
              with open(log_path(name, run), "w", encoding="utf-8", newline="") as log:
                  log.write("$ " + " ".join(cmd) + "\n")
                  proc = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                          env={**os.environ, **(env or {})})
                  for raw in proc.stdout:
                      sys.stdout.buffer.write(raw)
                      sys.stdout.buffer.flush()
                      line = ANSI.sub("", raw.decode("utf-8", "replace"))
                      log.write(line)
                      if m := RESULT.search(line):
                          passed += int(m[1])
                          failed += int(m[2])
                  code = proc.wait()
              print("::endgroup::", flush=True)
              ok = code == 0 and (not tests or (failed == 0 and passed >= 1))
              suites.append((name, run, passed if tests else "-", failed if tests else "-", code, ok))
              if not ok:
                  failures.append(f"{name} run {run} failed (exit {code}, {passed} passed, {failed} failed)")
              return ok, passed

          def check_hygiene(after):
              testwin = pids("testwin.exe")
              resident = pids("borderless-shatter.exe")
              tmp_clean = not E2E_TMP.exists() or not any(E2E_TMP.iterdir())
              appdata_same = appdata_state() == appdata_before
              ok = not testwin and resident == resident_before and tmp_clean and appdata_same
              row = (after,
                     "none" if not testwin else f"left running: {testwin}",
                     "same" if resident == resident_before else f"{resident_before} -> {resident}",
                     "empty" if tmp_clean else "NOT empty",
                     "unchanged" if appdata_same else "CHANGED")
              hygiene.append(row + ("ok" if ok else "FAILED",))
              if not ok:
                  failures.append(f"hygiene after {after}: " + ", ".join(row[1:]))

          def run_probe():
              """The probe prints one JSON line on stdout and exits 0 only when usable; anything else is not usable."""
              global probe, probe_exit
              print(f"::group::probe: {PROBE}", flush=True)
              try:
                  p = subprocess.run([str(PROBE)], capture_output=True, timeout=120)
                  probe_exit, out, err = p.returncode, p.stdout, p.stderr
              except subprocess.TimeoutExpired as e:
                  probe_exit, out, err = "timeout", e.stdout or b"", e.stderr or b""
              out, err = out.decode("utf-8", "replace"), err.decode("utf-8", "replace")
              text = f"exit: {probe_exit}\n--- stdout\n{out}\n--- stderr\n{err}\n"
              print(text, flush=True)
              print("::endgroup::", flush=True)
              log_path("probe", 1).write_text(text, encoding="utf-8")
              try:
                  data = json.loads(out)
              except ValueError:
                  data = None
              probe = data if isinstance(data, dict) else {}
              return probe_exit == 0 and probe.get("usable") is True

          def main():
              global resident_before, testwin_before, appdata_before
              resident_before = pids("borderless-shatter.exe")
              testwin_before = pids("testwin.exe")
              appdata_before = appdata_state()

              _, first = suite("properties", 1, ["cargo", "test", "--test", "properties"])
              _, second = suite("properties", 2, ["cargo", "test", "--test", "properties"])
              if first != second:
                  failures.append(f"properties passed {first} then {second}: the counts differ")
              suite("properties-2000", 1, ["cargo", "test", "--test", "properties"], env={"PROPTEST_CASES": "2000"})

              usable = run_probe()
              check_hygiene("probe")
              if not usable:
                  why = probe.get("error") or ("no JSON on stdout" if not probe else "usable is not true")
                  failures.append(f"no usable desktop session on this runner (probe exit {probe_exit}: {why}); window suites skipped")
                  return

              for run in (1, 2):
                  for name, cmd in SUITES:
                      suite(name, run, cmd)
                      check_hygiene(f"{name} run {run}")

              # One compile serves both: `--no-run` builds the mcp test and the examples it launches, the
              # second command only runs. Same env on both or cargo would rebuild. LTO off and 16 codegen
              # units only speed up the build; debug_assertions stays off and the exes stay GUI-subsystem.
              built, _ = suite("release-build", 1, ["cargo", "test", "--release", "--test", "mcp", "--examples", "--no-run"],
                               env=RELEASE_ENV, tests=False)
              if built:
                  suite("release-mcp", 1, ["cargo", "test", "--release", "--test", "mcp", "--", "--ignored", "--test-threads=1"],
                        env=RELEASE_ENV)
                  check_hygiene("release-mcp run 1")

          def cell(value):
              return str(value).replace("|", "\\|").replace("\r", " ").replace("\n", " ")

          def write_summary():
              out = ["## Session probe", "", "| key | value |", "|---|---|"]
              if probe is None:
                  out.append("| probe | not run |")
              else:
                  out += [f"| {k} | {cell(json.dumps(probe[k]) if k in probe else 'missing')} |" for k in PROBE_KEYS]
                  out.append(f"| exit code | {probe_exit} |")
              out += ["", "## Suites", "", "| suite | run | passed | failed | exit | status |", "|---|---|---|---|---|---|"]
              out += [f"| {n} | {r} | {p} | {f} | {c} | {'ok' if ok else 'FAILED'} |" for n, r, p, f, c, ok in suites]
              state = "absent" if appdata_before is None else f"{len(appdata_before)} file(s)"
              out += ["", "## Hygiene", "",
                      f"Before: borderless-shatter.exe PIDs {resident_before}, testwin.exe PIDs {testwin_before}, "
                      f"%APPDATA%\\BorderlessShatter {state}.", "",
                      "| after | testwin.exe | borderless-shatter.exe PIDs | target/e2e-tmp | %APPDATA%\\BorderlessShatter | status |",
                      "|---|---|---|---|---|---|"]
              out += ["| " + " | ".join(cell(v) for v in row) + " |" for row in hygiene]
              out += ["", "## Result", ""] + ([f"- {cell(f)}" for f in failures] or ["All green."])
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("\n".join(out) + "\n")

          try:
              main()
          except Exception as e:
              traceback.print_exc()
              failures.append(f"workflow script error: {e!r}")
          finally:
              write_summary()
          for f in failures:
              print("::error::" + f.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          sys.exit(1 if failures else 0)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e-logs
          retention-days: 14
